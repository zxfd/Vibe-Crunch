name: Micro workout tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/fully-random-exercises

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Vibe Crunch unit tests
        run: |
          python -m unittest \
            tests.test_health_sync \
            tests.test_micro_plan \
            tests.test_micro_config \
            tests.test_micro_gate \
            tests.test_micro_ui \
            tests.test_installer \
            tests.test_installer_codex \
            tests.test_app_sync
